name: orbit
description: Orbit messenger. Firebase-backed chats with groups, reactions, and media.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  path: ^1.9.1
  provider: ^6.1.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  image_picker: ^1.2.4
  file_picker: ^13.4.0
  record: ^6.2.1
  audioplayers: ^6.7.1
  video_player: ^2.11.1
  url_launcher: ^6.3.3
  http: ^1.6.0
  flutter_svg: ^2.3.4
  mime: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/stickers/
